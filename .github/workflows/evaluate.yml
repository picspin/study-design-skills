name: Study Evaluation

on:
  workflow_dispatch:
    inputs:
      study_json:
        description: 'study-package.json path (relative to repo root)'
        required: true
        default: 'examples/randomized_trial_confirmed.json'
      manuscript_md:
        description: 'Manuscript Markdown path (optional)'
        required: false
        default: ''
      cochrane_query:
        description: 'Cochrane search query (optional)'
        required: false
        default: ''
      title:
        description: 'Display title override (optional)'
        required: false
        default: ''
  push:
    paths:
      - 'examples/*.json'
      - 'skills/study-design-skills/scripts/*.py'
      - 'skills/study-design-skills/references/checklists/*.md'
      - '.github/workflows/evaluate.yml'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet numpy openpyxl pandas scipy jsonschema mpmath

      - name: Compile study specification
        run: |
          set -e
          JSON="${{ github.event.inputs.study_json || 'examples/randomized_trial_confirmed.json' }}"
          python skills/study-design-skills/scripts/compile_study_spec.py \
            "$JSON" --out /tmp/compiled-study-package.json

      - name: Validate study specification
        run: |
          set -e
          python skills/study-design-skills/scripts/validate_study_spec.py \
            /tmp/compiled-study-package.json

      - name: Generate study package
        run: |
          set -e
          python skills/study-design-skills/scripts/generate_study_package.py \
            /tmp/compiled-study-package.json \
            --out-dir /tmp/study-output \
            --formats html

      - name: Reporting compliance audit
        if: github.event.inputs.manuscript_md != ''
        run: |
          set -e
          python skills/study-design-skills/scripts/check_reporting_compliance.py \
            /tmp/compiled-study-package.json \
            "${{ github.event.inputs.manuscript_md }}" \
            --out /tmp/compliance-report.md

      - name: Cochrane evidence retrieval
        if: github.event.inputs.cochrane_query != ''
        run: |
          set -e
          python skills/study-design-skills/scripts/cochrane_evidence.py \
            search "${{ github.event.inputs.cochrane_query }}" \
            --out /tmp/cochrane-results.json

      - name: Generate evaluation HTML
        run: |
          set -e
          OPTS="--out /tmp/eval-page/index.html"
          if [ -f /tmp/compliance-report.md ]; then
            OPTS="$OPTS --compliance /tmp/compliance-report.md"
          fi
          if [ -f /tmp/cochrane-results.json ]; then
            OPTS="$OPTS --cochrane /tmp/cochrane-results.json"
          fi
          if [ -n "${{ github.event.inputs.title }}" ]; then
            OPTS="$OPTS --study-title '${{ github.event.inputs.title }}'"
          fi
          python skills/study-design-skills/scripts/generate_evaluation_html.py \
            /tmp/compiled-study-package.json $OPTS

      - name: Assemble and verify evaluation directory
        run: |
          mkdir -p /tmp/eval-page
          # index.html must exist (generated in previous step)
          if [ ! -s /tmp/eval-page/index.html ]; then
            echo "ERROR: index.html missing or empty"
            exit 1
          fi
          echo "index.html OK ($(wc -c < /tmp/eval-page/index.html) bytes)"
          # Flatten study-output into eval-page (no nested dirs, no symlinks)
          if [ -d /tmp/study-output ]; then
            rsync -aL /tmp/study-output/ /tmp/eval-page/ 2>/dev/null || \
              cp -rL /tmp/study-output/* /tmp/eval-page/ 2>/dev/null || true
          fi
          # Copy optional reports
          [ -f /tmp/compliance-report.md ] && cp /tmp/compliance-report.md /tmp/eval-page/
          [ -f /tmp/cochrane-results.json ] && cp /tmp/cochrane-results.json /tmp/eval-page/
          echo "=== Published files ==="
          find /tmp/eval-page -maxdepth 2 -type f | head -20
          echo "=== No symlinks check ==="
          if find /tmp/eval-page -type l | grep -q .; then
            echo "ERROR: symlinks found in eval-page"
            find /tmp/eval-page -type l
            exit 1
          fi
          echo "No symlinks — clean"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: study-evaluation-html
          path: /tmp/eval-page
          retention-days: 30

  deploy-pages:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: study-evaluation-html
          path: /tmp/eval-page

      - name: Verify artifact
        run: |
          echo "=== Artifact contents ==="
          find /tmp/eval-page -type f
          if [ ! -s /tmp/eval-page/index.html ]; then
            echo "ERROR: index.html missing or empty in downloaded artifact"
            exit 1
          fi
          echo "Artifact verified OK"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: study-evaluation-html
