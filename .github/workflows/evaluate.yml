name: Study Evaluation

on:
  workflow_dispatch:
    inputs:
      study_json:
        description: 'study-package.json path (relative to repo root)'
        required: true
        default: 'examples/randomized_trial_confirmed.json'
      manuscript_md:
        description: 'Manuscript Markdown path (optional)'
        required: false
        default: ''
      cochrane_query:
        description: 'Cochrane search query (optional, e.g. "clinical decision support medication error")'
        required: false
        default: ''
      title:
        description: 'Display title override (optional)'
        required: false
        default: ''
  push:
    paths:
      - 'examples/*.json'
      - 'skills/study-design-skills/scripts/*.py'
      - 'skills/study-design-skills/references/checklists/*.md'
      - '.github/workflows/evaluate.yml'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet numpy openpyxl pandas scipy jsonschema mpmath

      - name: Compile study specification
        run: |
          JSON="${{ github.event.inputs.study_json || 'examples/randomized_trial_confirmed.json' }}"
          python skills/study-design-skills/scripts/compile_study_spec.py \
            "$JSON" --out /tmp/compiled-study-package.json
          python -c "import json; d=json.load(open('/tmp/compiled-study-package.json')); print('Title:', d.get('study_title','?'))"

      - name: Validate study specification
        run: |
          python skills/study-design-skills/scripts/validate_study_spec.py \
            /tmp/compiled-study-package.json || echo "Non-fatal warnings above"

      - name: Generate study package
        run: |
          python skills/study-design-skills/scripts/generate_study_package.py \
            /tmp/compiled-study-package.json \
            --out-dir /tmp/study-output \
            --formats html,json || echo "Non-fatal"

      - name: Reporting compliance audit
        if: github.event.inputs.manuscript_md != ''
        run: |
          python skills/study-design-skills/scripts/check_reporting_compliance.py \
            /tmp/compiled-study-package.json \
            "${{ github.event.inputs.manuscript_md }}" \
            --out /tmp/compliance-report.md || true

      - name: Cochrane evidence retrieval
        if: github.event.inputs.cochrane_query != ''
        run: |
          python skills/study-design-skills/scripts/cochrane_evidence.py \
            search "${{ github.event.inputs.cochrane_query }}" \
            --out /tmp/cochrane-results.json || true

      - name: Generate evaluation HTML
        run: |
          OPTS="--out /tmp/eval-page/index.html"
          [ -f /tmp/compliance-report.md ] && OPTS="$OPTS --compliance /tmp/compliance-report.md"
          [ -f /tmp/cochrane-results.json ] && OPTS="$OPTS --cochrane /tmp/cochrane-results.json"
          [ -n "${{ github.event.inputs.title }}" ] && OPTS="$OPTS --study-title '${{ github.event.inputs.title }}'"
          python skills/study-design-skills/scripts/generate_evaluation_html.py \
            /tmp/compiled-study-package.json $OPTS

      - name: Assemble evaluation directory
        run: |
          mkdir -p /tmp/eval-page/outputs
          [ -d /tmp/study-output ] && cp -r /tmp/study-output/* /tmp/eval-page/outputs/
          [ -f /tmp/compliance-report.md ] && cp /tmp/compliance-report.md /tmp/eval-page/outputs/
          [ -f /tmp/cochrane-results.json ] && cp /tmp/cochrane-results.json /tmp/eval-page/outputs/
          echo "=== Published files ===" && find /tmp/eval-page -type f

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: study-evaluation-html
          path: /tmp/eval-page
          retention-days: 30

  deploy-pages:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Upload to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: study-evaluation-html
