name: Self-Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integrity-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run installer self-test
        run: |
          python installers/install.py --self-test --verbose

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run study-design regression tests
        run: python -m unittest discover -s tests -q

      - name: Validate schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          schema = json.loads(Path('skills/study-design-skills/schemas/study-package.schema.json').read_text())
          assert 'required' in schema
          assert schema['required'][0] == 'schema_version'
          print(f'Schema OK: {len(schema["properties"])} properties')
          PY

      - name: Validate route-registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          reg = json.loads(Path('skills/study-design-skills/references/route-registry.json').read_text())
          assert 'routes' in reg
          for rid, route in reg['routes'].items():
              assert 'family' in route, f'{rid} missing family'
              assert 'references' in route, f'{rid} missing references'
              assert 'rubric' in route, f'{rid} missing rubric'
          print(f'Registry OK: {len(reg["routes"])} routes')
          PY

      - name: Verify all vendored checklists
        run: |
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path('skills/study-design-skills/references/checklists').glob('*.md'))
          assert len(files) >= 27, f'Expected at least 27 checklist files, found {len(files)}'
          for file in files:
              content = file.read_text()
              assert 'acronym:' in content, f'{file.name} missing frontmatter acronym'
              assert '---' in content, f'{file.name} missing frontmatter delimiter'
              item_count = sum(line.startswith('|') for line in content.splitlines())
              print(f'  {file.name} ({item_count} table lines)')
          print(f'All {len(files)} checklist files verified')
          PY

      - name: Check Python syntax
        run: python -m compileall -q skills/study-design-skills/scripts

      - name: Verify SKILL.md frontmatter
        run: |
          head -5 skills/study-design-skills/SKILL.md | grep -q 'name:' || (echo 'SKILL.md missing name:'; exit 1)
          head -5 skills/study-design-skills/SKILL.md | grep -q 'description:' || (echo 'SKILL.md missing description:'; exit 1)
          echo 'SKILL.md frontmatter OK'
