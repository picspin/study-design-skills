name: Self-Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integrity-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run installer self-test
        run: |
          python installers/install.py --self-test --verbose

      - name: Validate schema
        run: |
          python -c "
import json
schema = json.loads(open('skills/study-design-skills/schemas/study-package.schema.json').read())
assert 'required' in schema
assert schema['required'][0] == 'schema_version'
print(f'Schema OK — {len(schema[\"properties\"])} properties')
"

      - name: Validate route-registry
        run: |
          python -c "
import json
reg = json.loads(open('skills/study-design-skills/references/route-registry.json').read())
assert 'routes' in reg
for rid, r in reg['routes'].items():
    assert 'family' in r, f'{rid} missing family'
    assert 'references' in r, f'{rid} missing references'
    assert 'rubric' in r, f'{rid} missing rubric'
print(f'Registry OK — {len(reg[\"routes\"])} routes')
"

      - name: Verify all vendored checklists
        run: |
          python -c "
from pathlib import Path
checklist_dir = Path('skills/study-design-skills/references/checklists')
files = sorted(checklist_dir.glob('*.md'))
assert len(files) >= 27, f'Expected ≥27 checklist files, found {len(files)}'
for f in files:
    content = f.read_text()
    assert 'acronym:' in content, f'{f.name} missing frontmatter acronym'
    assert '---' in content, f'{f.name} missing frontmatter delimiter'
    item_count = sum(1 for line in content.split(chr(10)) if line.startswith('|'))
    print(f'  {f.name} ({item_count} lines)')
print(f'All {len(files)} checklist files verified')
"

      - name: Check all scripts import
        run: |
          for py in skills/study-design-skills/scripts/*.py; do
            if [[ "$(basename $py)" == "_batch_create_checklists.py" ]]; then
              continue  # build helper, not a production script
            fi
            python -c "import ast; ast.parse(open('$py').read()); print(f'  OK {$(basename $py)}')"
            echo "  SKIP import test for $(basename $py)"  # some have __main__ guards
          done

      - name: Verify SKILL.md frontmatter
        run: |
          head -5 skills/study-design-skills/SKILL.md | grep -q 'name:' || (echo 'SKILL.md missing name:'; exit 1)
          head -5 skills/study-design-skills/SKILL.md | grep -q 'description:' || (echo 'SKILL.md missing description:'; exit 1)
          echo 'SKILL.md frontmatter OK'